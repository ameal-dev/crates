version: 2

builds:
  - main: ./cmd/crates
    binary: crates
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    name_template: "crates_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: ameal-dev
      name: homebrew-tap
    homepage: https://github.com/ameal-dev/crates
    description: Socratic coding tutor — the understanding layer for AI-assisted coding
    license: MIT
    install: |
      bin.install "crates"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
